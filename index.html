<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Necessary? — Spending Tracker</title>
<meta name="description" content="Log a purchase in two taps: was it Necessary or Unnecessary? See how much you've wasted this month, subscriptions included. Works offline, installs on your phone." />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#12131a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Necessary?" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<style>
  :root{
    --bg:#12131a; --card:#1c1e28; --card-2:#171922; --field:#22242f;
    --line:#2b2e3a; --ink:#e7e9f0; --ink-soft:#b8bcca; --muted:#7c8091;
    --need:#22c55e;  --need-bg:#0e2a1c;  --need-ink:#a7f3c8;
    --not:#f4405a;   --not-bg:#2e0f16;   --not-ink:#ffb3c0;
    --accent:#7c6cff; --accent-2:#5b8dff;
    --radius:22px; --radius-sm:15px; font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4;min-height:100dvh;overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{max-width:520px;margin:0 auto;position:relative;min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom) + 92px);}
  button{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  .screen{display:none;flex-direction:column;padding:0 18px;}
  .screen.active{display:flex;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 4px 6px;}
  .topbar h1{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;margin:0;}
  .topbar .sub{color:var(--muted);font-size:.8rem;margin-top:2px;font-weight:600;}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--ink-soft);width:42px;height:42px;border-radius:13px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:active{transform:scale(.93);}

  /* running monthly readout */
  .monthstrip{display:flex;gap:10px;margin:8px 0 2px;}
  .mchip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;}
  .mchip .k{font-size:.72rem;color:var(--muted);font-weight:700;}
  .mchip .v{font-size:1.15rem;font-weight:800;margin-top:2px;letter-spacing:-0.01em;}
  .mchip.warn .v{color:var(--not);}

  /* amount */
  .amount-wrap{text-align:center;margin:12px 0 2px;border-radius:var(--radius);padding:22px 18px 18px;color:#fff;overflow:hidden;
    background:radial-gradient(120% 130% at 15% 0%, rgba(124,108,255,.5), transparent 55%),radial-gradient(130% 130% at 100% 20%, rgba(91,141,255,.4), transparent 50%),#191b26;border:1px solid var(--line);}
  .amount-wrap .cap{font-size:.8rem;opacity:.85;font-weight:700;letter-spacing:.03em;}
  .amount{font-size:3.5rem;font-weight:800;line-height:1.04;letter-spacing:-0.03em;margin-top:2px;display:flex;align-items:baseline;justify-content:center;gap:4px;min-height:3.6rem;}
  .amount .cur{font-size:1.9rem;font-weight:800;opacity:.9;}
  .amount.empty{opacity:.45;}

  /* the two big verdict buttons */
  .verdicts{display:flex;gap:11px;margin-top:14px;}
  .verdict{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--radius-sm);
    padding:16px 8px 14px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .07s;}
  .verdict .emoji{font-size:1.7rem;line-height:1;}
  .verdict .lbl{font-size:1rem;font-weight:800;letter-spacing:-0.01em;}
  .verdict .hint{font-size:.72rem;color:var(--muted);font-weight:600;}
  .verdict.need{border-color:#1f6e46;background:linear-gradient(180deg,var(--need-bg),var(--card));}
  .verdict.need .lbl{color:var(--need-ink);}
  .verdict.not{border-color:#7a2233;background:linear-gradient(180deg,var(--not-bg),var(--card));}
  .verdict.not .lbl{color:var(--not-ink);}
  .verdict:active{transform:scale(.96);}
  .verdict:disabled{opacity:.4;cursor:default;filter:grayscale(.3);}
  .verdict:disabled .lbl{color:var(--ink-soft);}

  .note-toggle{margin:12px auto 0;background:none;border:none;color:var(--muted);font-size:.85rem;font-weight:700;cursor:pointer;padding:4px 8px;}
  .note-in{margin-top:8px;width:100%;background:var(--field);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);padding:13px 15px;font-size:1rem;outline:none;-webkit-user-select:text;user-select:text;}
  .note-in::placeholder{color:var(--muted);}
  .note-in:focus{border-color:var(--accent);}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;}
  .key{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-sm);font-size:1.55rem;font-weight:700;padding:16px 0;cursor:pointer;}
  .key:active{transform:scale(.95);background:var(--field);}
  .key.wide{font-size:1.15rem;}

  /* generic buttons */
  .btn{width:100%;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:1.02rem;font-weight:800;padding:16px;cursor:pointer;box-shadow:0 10px 26px rgba(124,108,255,.26);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:none;}
  .btn:disabled{opacity:.45;box-shadow:none;filter:grayscale(.4);}

  /* lists */
  .row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:9px;}
  .row .dot{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .row .dot.need{background:var(--need-bg);} .row .dot.not{background:var(--not-bg);}
  .row .mid{flex:1;min-width:0;}
  .row .t1{font-weight:700;font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .t2{color:var(--muted);font-size:.76rem;font-weight:600;margin-top:1px;}
  .row .amt{font-weight:800;font-size:1rem;flex-shrink:0;}
  .row .amt.need{color:var(--need);} .row .amt.not{color:var(--not);}
  .row .act{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:4px 2px 4px 8px;flex-shrink:0;}
  .row .act:active{color:var(--not);}

  .section-title{font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 10px;}
  .empty-state{text-align:center;color:var(--muted);padding:44px 20px;}
  .empty-state .big{font-size:2.6rem;margin-bottom:8px;}
  .empty-state p{font-size:.92rem;font-weight:600;margin:4px 0;}

  /* insights */
  .period-row{display:flex;gap:8px;margin:12px 0 4px;}
  .period{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);padding:9px 4px;border-radius:12px;font-size:.82rem;font-weight:700;cursor:pointer;text-align:center;}
  .period.sel{background:var(--field);color:var(--ink);border-color:var(--muted);}
  .hero{margin-top:14px;border-radius:var(--radius);padding:22px 20px;color:#fff;overflow:hidden;
    background:radial-gradient(120% 140% at 100% 0%, rgba(244,64,90,.6), transparent 55%),#241019;border:1px solid #43202b;}
  .hero.good{background:radial-gradient(120% 140% at 100% 0%, rgba(34,197,94,.5), transparent 55%),#10251a;border-color:#1f5039;}
  .hero .cap{font-size:.82rem;font-weight:700;opacity:.9;}
  .hero .big{font-size:2.9rem;font-weight:800;letter-spacing:-0.03em;margin:2px 0;color:#ff9aab;}
  .hero.good .big{color:#8ef0b8;}
  .hero .msg{font-size:.9rem;font-weight:600;opacity:.92;}
  .split-card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .split-title{font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .split-total{font-size:1.9rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:14px;}
  .split-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--field);}
  .split-bar span{display:block;height:100%;}
  .split-legend{display:flex;flex-direction:column;gap:11px;margin-top:16px;}
  .leg{display:flex;align-items:center;gap:11px;}
  .leg .sw{width:11px;height:11px;border-radius:4px;flex-shrink:0;}
  .leg .lname{flex:1;font-weight:700;font-size:.92rem;}
  .leg .lsub{color:var(--muted);font-size:.78rem;font-weight:600;}
  .leg .lamt{font-weight:800;font-size:.95rem;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 16px;}
  .stat .k{font-size:.76rem;color:var(--muted);font-weight:700;}
  .stat .v{font-size:1.35rem;font-weight:800;margin-top:4px;letter-spacing:-0.02em;}

  /* nav */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(92%,480px);
    background:rgba(28,30,40,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;display:flex;padding:7px;z-index:30;box-shadow:0 12px 34px rgba(0,0,0,.5);}
  .nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 4px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:700;}
  .nav button .ic{font-size:1.25rem;line-height:1;}
  .nav button.active{color:var(--ink);background:var(--field);}
  .nav button.active.log{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));}
  .nav button:active{transform:scale(.94);}

  /* toast + sheet */
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--ink);color:#111;padding:12px 18px;border-radius:14px;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:92%;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast button{background:none;border:none;color:var(--accent);font-weight:800;cursor:pointer;font-size:.9rem;}
  .sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-back.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:20px 20px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(100%);transition:transform .25s cubic-bezier(.3,.8,.3,1);max-width:520px;margin:0 auto;}
  .sheet.show{transform:translateY(0);}
  .sheet h2{margin:0 0 4px;font-size:1.15rem;font-weight:800;}
  .sheet .subt{color:var(--muted);font-size:.84rem;margin-bottom:14px;}
  .sheet-row{width:100%;display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 15px;margin-bottom:9px;font-size:.94rem;font-weight:600;cursor:pointer;text-align:left;}
  .sheet-row:active{transform:scale(.98);}
  .fld{margin-bottom:13px;}
  .fld label{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .fld select,.fld input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:1rem;outline:none;-webkit-user-select:text;user-select:text;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;background:var(--field);border:1px solid var(--line);color:var(--ink-soft);border-radius:12px;padding:12px 6px;font-weight:800;font-size:.9rem;cursor:pointer;}
  .seg button.sel.need{background:var(--need-bg);border-color:var(--need);color:var(--need-ink);}
  .seg button.sel.not{background:var(--not-bg);border-color:var(--not);color:var(--not-ink);}
</style>
</head>
<body>
<div id="app">

  <!-- ============ LOG ============ -->
  <section class="screen active" id="screen-log">
    <div class="topbar">
      <div><h1>Log a spend</h1><div class="sub" id="log-sub">Two taps and you're done.</div></div>
      <button class="icon-btn" id="open-settings" aria-label="Settings">⚙️</button>
    </div>

    <div class="monthstrip">
      <div class="mchip"><div class="k">This month</div><div class="v num" id="m-total">—</div></div>
      <div class="mchip warn"><div class="k">Unnecessary</div><div class="v num" id="m-unnec">—</div></div>
    </div>

    <div class="amount-wrap">
      <div class="cap">AMOUNT</div>
      <div class="amount empty num" id="amount-display"><span class="cur" id="cur-sym">$</span><span id="amount-val">0</span></div>
    </div>

    <div class="verdicts">
      <button class="verdict need" id="v-need" disabled><span class="emoji">✅</span><span class="lbl">Necessary</span><span class="hint">I needed it</span></button>
      <button class="verdict not" id="v-not" disabled><span class="emoji">🙅</span><span class="lbl">Unnecessary</span><span class="hint">I didn't</span></button>
    </div>

    <button class="note-toggle" id="note-toggle">＋ add a note (optional)</button>
    <input class="note-in" id="note-in" type="text" placeholder="What was it? (e.g. coffee)" maxlength="60" autocomplete="off" style="display:none" />

    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key wide" data-k=".">.</button><button class="key" data-k="0">0</button><button class="key wide" data-k="del">⌫</button>
    </div>
  </section>

  <!-- ============ SUBSCRIPTIONS ============ -->
  <section class="screen" id="screen-subs">
    <div class="topbar">
      <div><h1>Subscriptions</h1><div class="sub" id="subs-sub">Your monthly recurring spend</div></div>
      <button class="icon-btn" id="open-settings-2" aria-label="Settings">⚙️</button>
    </div>
    <button class="btn" id="add-sub-btn" style="margin-top:10px">＋ Add a subscription</button>
    <div id="subs-list" style="margin-top:16px"></div>
  </section>

  <!-- ============ INSIGHTS ============ -->
  <section class="screen" id="screen-insights">
    <div class="topbar">
      <div><h1>Insights</h1><div class="sub">Necessary vs. unnecessary</div></div>
      <button class="icon-btn" id="open-settings-3" aria-label="Settings">⚙️</button>
    </div>
    <div class="period-row" id="period-row">
      <button class="period sel" data-p="month">This month</button>
      <button class="period" data-p="all">All time</button>
    </div>
    <div id="insights-body"></div>
  </section>

  <nav class="nav">
    <button data-go="log" class="log active"><span class="ic">＋</span>Log</button>
    <button data-go="subs"><span class="ic">🔁</span>Subscriptions</button>
    <button data-go="insights"><span class="ic">📊</span>Insights</button>
  </nav>

  <div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-action" style="display:none"></button></div>

  <!-- settings sheet -->
  <div class="sheet-back" id="sheet-back"></div>
  <div class="sheet" id="sheet-settings">
    <h2>Settings</h2>
    <div class="subt">Your data stays on this device only.</div>
    <div class="fld"><label>Currency symbol</label>
      <select id="currency-sel">
        <option value="$">$ — Dollar</option><option value="€">€ — Euro</option><option value="£">£ — Pound</option>
        <option value="¥">¥ — Yen / Yuan</option><option value="₹">₹ — Rupee</option><option value="₽">₽ — Ruble</option>
        <option value="₩">₩ — Won</option><option value="R$">R$ — Real</option><option value="C$">C$ — CAD</option>
        <option value="A$">A$ — AUD</option><option value="Fr">Fr — Franc</option><option value="kr">kr — Krona</option>
      </select>
    </div>
    <button class="sheet-row" id="export-btn">⬇️&nbsp; Export my data (backup)</button>
    <button class="sheet-row" id="import-btn">⬆️&nbsp; Import a backup</button>
    <button class="sheet-row" id="wipe-btn" style="color:var(--not)">🗑️&nbsp; Delete everything</button>
    <input type="file" id="import-file" accept="application/json,.json" style="display:none" />
  </div>

  <!-- add/edit subscription sheet -->
  <div class="sheet" id="sheet-sub">
    <h2 id="sub-sheet-title">Add a subscription</h2>
    <div class="subt">Counted automatically in every month.</div>
    <div class="fld"><label>Name</label><input id="sub-name" type="text" placeholder="e.g. Netflix" maxlength="40" autocomplete="off" /></div>
    <div class="fld"><label>Amount per month</label><input id="sub-amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" /></div>
    <div class="fld"><label>Is it necessary?</label>
      <div class="seg" id="sub-seg">
        <button type="button" class="need" data-b="need">✅ Necessary</button>
        <button type="button" class="not" data-b="not">🙅 Unnecessary</button>
      </div>
    </div>
    <button class="btn" id="sub-save" style="margin-top:6px">Save subscription</button>
    <button class="btn ghost" id="sub-cancel" style="margin-top:9px">Cancel</button>
  </div>

</div>

<script>
(function(){
  "use strict";
  var PKEY="spend.purchases.v2", SKEY="spend.subs.v1", SETKEY="spendlog.settings.v1", OLDKEY="spendlog.v1";

  /* ---------- storage + migration ---------- */
  function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function writeJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var purchases = readJSON(PKEY);
  if(!Array.isArray(purchases)){
    // migrate old 3-bucket log (need/want/stupid) -> need/not
    var old = readJSON(OLDKEY);
    purchases = Array.isArray(old) ? old.map(function(t){
      return { id:t.id||rid(), amount:+t.amount||0, bucket:(t.bucket==="need"?"need":"not"), note:t.note||"", ts:t.ts||Date.now() };
    }) : [];
    writeJSON(PKEY, purchases);
  }
  var subs = readJSON(SKEY); if(!Array.isArray(subs)) subs = [];
  var settings = Object.assign({currency:"$"}, readJSON(SETKEY)||{});

  function savePurchases(){ writeJSON(PKEY, purchases); }
  function saveSubs(){ writeJSON(SKEY, subs); }
  function saveSettings(){ writeJSON(SETKEY, settings); }
  function rid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  /* ---------- helpers ---------- */
  var $=function(s,r){return (r||document).querySelector(s);};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var B={ need:{label:"Necessary",emoji:"✅",color:"var(--need)"}, not:{label:"Unnecessary",emoji:"🙅",color:"var(--not)"} };
  function cur(){ return settings.currency||"$"; }
  function fmt(n){ var neg=n<0; n=Math.abs(n); var s=(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); return (neg?"-":"")+cur()+s; }
  function monthStart(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function relDay(ts){ var t=new Date(ts); t.setHours(0,0,0,0); var today=new Date(); today.setHours(0,0,0,0);
    var diff=Math.round((today-t)/86400000); if(diff===0)return "Today"; if(diff===1)return "Yesterday";
    return new Date(ts).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
  function vibrate(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

  /* ---------- monthly aggregates ---------- */
  function subsActive(){ return subs.filter(function(s){ return s.active!==false; }); }
  function monthAgg(){
    var from=monthStart();
    var mp=purchases.filter(function(t){ return t.ts>=from; });
    var need=0,not=0,cNeed=0,cNot=0;
    mp.forEach(function(t){ if(t.bucket==="need"){need+=t.amount;cNeed++;} else {not+=t.amount;cNot++;} });
    var sNeed=0,sNot=0; subsActive().forEach(function(s){ if(s.bucket==="need")sNeed+=s.amount; else sNot+=s.amount; });
    return { need:need+sNeed, not:not+sNot, total:need+not+sNeed+sNot, count:mp.length,
             oneOffNot:not, subsNot:sNot, subsTotal:sNeed+sNot, cNot:cNot, purchases:mp };
  }

  /* ---------- LOG ---------- */
  var entry={ amount:"", note:"" };
  var amountVal=$("#amount-val"), amountDisp=$("#amount-display"), curSym=$("#cur-sym"),
      vNeed=$("#v-need"), vNot=$("#v-not"), noteIn=$("#note-in");

  function renderAmount(){
    amountVal.textContent = entry.amount===""?"0":entry.amount;
    var val=parseFloat(entry.amount)||0;
    amountDisp.classList.toggle("empty", val===0);
    curSym.textContent=cur();
    var ok=val>0; vNeed.disabled=!ok; vNot.disabled=!ok;
  }
  function renderMonthStrip(){
    var a=monthAgg();
    $("#m-total").textContent=fmt(a.total);
    $("#m-unnec").textContent=fmt(a.not);
  }
  $("#keypad").addEventListener("click",function(e){
    var b=e.target.closest(".key"); if(!b)return; var k=b.getAttribute("data-k"), a=entry.amount;
    if(k==="del"){ a=a.slice(0,-1); }
    else if(k==="."){ if(a.indexOf(".")===-1) a=(a===""?"0":a)+"."; }
    else { if(a==="0")a=k; else if(a.indexOf(".")>-1&&a.split(".")[1].length>=2){} else if(a.replace(".","").length>=9){} else a+=k; }
    entry.amount=a; renderAmount();
  });
  $("#note-toggle").addEventListener("click",function(){
    var shown=noteIn.style.display!=="none";
    noteIn.style.display=shown?"none":"block"; this.textContent=shown?"＋ add a note (optional)":"− hide note";
    if(!shown) setTimeout(function(){noteIn.focus();},50);
  });
  noteIn.addEventListener("input",function(){ entry.note=noteIn.value; });
  noteIn.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();noteIn.blur();} });

  function logSpend(bucket){
    var amt=parseFloat(entry.amount); if(!(amt>0))return;
    var item={ id:rid(), amount:Math.round(amt*100)/100, bucket:bucket, note:entry.note.trim(), ts:Date.now() };
    purchases.push(item); savePurchases();
    entry={amount:"",note:""}; noteIn.value=""; noteIn.style.display="none"; $("#note-toggle").textContent="＋ add a note (optional)";
    renderAmount(); renderMonthStrip();
    vibrate(bucket==="not"?[18,40,18]:14);
    var msg=bucket==="not"?("Logged "+fmt(item.amount)+" · unnecessary 🙅"):("Logged "+fmt(item.amount)+" · necessary ✅");
    toast(msg,"Undo",function(){ var i=purchases.findIndex(function(p){return p.id===item.id;}); if(i>-1){purchases.splice(i,1);savePurchases();renderMonthStrip();renderInsights();} });
    renderInsights();
  }
  vNeed.addEventListener("click",function(){ logSpend("need"); });
  vNot.addEventListener("click",function(){ logSpend("not"); });

  /* ---------- SUBSCRIPTIONS ---------- */
  var subEditId=null, subBucket="not";
  function renderSubs(){
    var list=$("#subs-list");
    var act=subsActive();
    var totMo=act.reduce(function(s,x){return s+x.amount;},0);
    var notMo=act.reduce(function(s,x){return s+(x.bucket==="not"?x.amount:0);},0);
    $("#subs-sub").textContent = subs.length ? (fmt(totMo)+"/mo · "+fmt(notMo)+" unnecessary") : "Your monthly recurring spend";
    if(!subs.length){ list.innerHTML='<div class="empty-state"><div class="big">🔁</div><p>No subscriptions yet.</p><p>Add Netflix, Spotify, gym… and they\'ll count every month automatically.</p></div>'; return; }
    var html="";
    subs.slice().sort(function(a,b){return (a.name||"").localeCompare(b.name||"");}).forEach(function(s){
      var b=B[s.bucket]||B.not; var paused=s.active===false;
      html+='<div class="row" style="'+(paused?"opacity:.5":"")+'">'
        +'<div class="dot '+s.bucket+'">'+b.emoji+'</div>'
        +'<div class="mid"><div class="t1">'+esc(s.name||"Subscription")+'</div><div class="t2">'+b.label+(paused?" · paused":"")+'</div></div>'
        +'<div class="amt '+s.bucket+' num">'+fmt(s.amount)+'<span style="color:var(--muted);font-weight:600">/mo</span></div>'
        +'<button class="act" data-edit="'+s.id+'" aria-label="Edit">✎</button>'
        +'<button class="act" data-del="'+s.id+'" aria-label="Delete">✕</button>'
        +'</div>';
    });
    list.innerHTML=html;
  }
  $("#subs-list").addEventListener("click",function(e){
    var ed=e.target.closest("[data-edit]"), dl=e.target.closest("[data-del]");
    if(ed){ openSubSheet(ed.getAttribute("data-edit")); }
    else if(dl){ var id=dl.getAttribute("data-del"); var i=subs.findIndex(function(s){return s.id===id;});
      if(i>-1){ var rm=subs.splice(i,1)[0]; saveSubs(); renderSubs(); renderMonthStrip(); renderInsights();
        toast("Removed "+(rm.name||"subscription"),"Undo",function(){ subs.push(rm); saveSubs(); renderSubs(); renderMonthStrip(); renderInsights(); }); } }
  });
  $("#add-sub-btn").addEventListener("click",function(){ openSubSheet(null); });
  function openSubSheet(id){
    subEditId=id;
    if(id){ var s=subs.find(function(x){return x.id===id;});
      $("#sub-sheet-title").textContent="Edit subscription"; $("#sub-name").value=s.name||""; $("#sub-amount").value=s.amount||""; subBucket=s.bucket||"not";
    } else { $("#sub-sheet-title").textContent="Add a subscription"; $("#sub-name").value=""; $("#sub-amount").value=""; subBucket="not"; }
    $$("#sub-seg button").forEach(function(el){ el.classList.toggle("sel", el.getAttribute("data-b")===subBucket); });
    openSheet($("#sheet-sub"));
  }
  $("#sub-seg").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return; subBucket=b.getAttribute("data-b");
    $$("#sub-seg button").forEach(function(el){ el.classList.toggle("sel", el===b); }); });
  $("#sub-save").addEventListener("click",function(){
    var name=$("#sub-name").value.trim(), amt=parseFloat($("#sub-amount").value);
    if(!name){ toast("Give it a name"); return; }
    if(!(amt>0)){ toast("Enter the monthly amount"); return; }
    amt=Math.round(amt*100)/100;
    if(subEditId){ var s=subs.find(function(x){return x.id===subEditId;}); if(s){ s.name=name; s.amount=amt; s.bucket=subBucket; } }
    else { subs.push({ id:rid(), name:name, amount:amt, bucket:subBucket, active:true, ts:Date.now() }); }
    saveSubs(); renderSubs(); renderMonthStrip(); renderInsights(); closeSheets(); toast("Saved ✓");
  });
  $("#sub-cancel").addEventListener("click", closeSheets);

  /* ---------- INSIGHTS ---------- */
  var period="month";
  $("#period-row").addEventListener("click",function(e){ var b=e.target.closest(".period"); if(!b)return;
    period=b.getAttribute("data-p"); $$(".period").forEach(function(el){ el.classList.toggle("sel", el===b); }); renderInsights(); });

  function renderInsights(){
    var body=$("#insights-body");
    var need,not,total,count,subsLine,periodWord,recent;
    if(period==="month"){
      var a=monthAgg(); need=a.need; not=a.not; total=a.total; count=a.count; periodWord="this month";
      subsLine=a.subsTotal>0 ? (" · incl. "+fmt(a.subsTotal)+" of subscriptions") : "";
      recent=a.purchases.slice().sort(function(x,y){return y.ts-x.ts;});
    } else {
      need=0;not=0;count=purchases.length; purchases.forEach(function(t){ if(t.bucket==="need")need+=t.amount; else not+=t.amount; });
      total=need+not; periodWord="all time"; subsLine=""; recent=purchases.slice().sort(function(x,y){return y.ts-x.ts;});
    }
    if(total<=0 && count===0){ body.innerHTML='<div class="empty-state"><div class="big">📊</div><p>Nothing logged '+periodWord+' yet.</p><p>Log a spend on the ＋ tab and your split shows up here.</p></div>'; return; }
    var pct=function(v){ return total?Math.round(v/total*100):0; };
    var good=not===0;
    var msg = good ? ("Zero unnecessary spending "+periodWord+". Nice. 🙌")
                   : (fmt(not)+" of your "+fmt(total)+" "+periodWord+" ("+pct(not)+"%) went on things you didn't need.");

    var html=''
      +'<div class="hero'+(good?" good":"")+'">'
      +  '<div class="cap">🙅 UNNECESSARY '+periodWord.toUpperCase()+'</div>'
      +  '<div class="big num">'+fmt(not)+'</div>'
      +  '<div class="msg">'+msg+subsLine+'</div>'
      +'</div>'
      +'<div class="split-card">'
      +  '<div class="split-title">Total spent '+periodWord+'</div><div class="split-total num">'+fmt(total)+'</div>'
      +  '<div class="split-bar">'+(need?'<span style="width:'+(need/total*100)+'%;background:var(--need)"></span>':'')+(not?'<span style="width:'+(not/total*100)+'%;background:var(--not)"></span>':'')+'</div>'
      +  '<div class="split-legend">'
      +    leg("need","Necessary",need,pct(need))+leg("not","Unnecessary",not,pct(not))
      +  '</div>'
      +'</div>'
      +'<div class="stat-grid">'
      +  '<div class="stat"><div class="k">Purchases</div><div class="v num">'+count+'</div></div>'
      +  '<div class="stat"><div class="k">Wasted</div><div class="v num" style="color:var(--not)">'+pct(not)+'%</div></div>'
      +'</div>';

    // recent list (acts as history; deletable)
    html+='<div class="section-title">Recent purchases</div>';
    if(!recent.length){ html+='<div class="empty-state" style="padding:24px"><p>No one-off purchases '+periodWord+'.</p></div>'; }
    else { recent.slice(0,40).forEach(function(t){ var b=B[t.bucket]||B.not;
      html+='<div class="row"><div class="dot '+t.bucket+'">'+b.emoji+'</div>'
        +'<div class="mid"><div class="t1">'+(t.note?esc(t.note):b.label)+'</div><div class="t2">'+relDay(t.ts)+' · '+b.label+'</div></div>'
        +'<div class="amt '+t.bucket+' num">'+fmt(t.amount)+'</div>'
        +'<button class="act" data-delp="'+t.id+'" aria-label="Delete">✕</button></div>';
    }); }
    body.innerHTML=html;
  }
  function leg(bk,name,amt,p){ return '<div class="leg"><span class="sw" style="background:'+B[bk].color+'"></span>'
    +'<span class="lname">'+name+'</span><span class="lamt num">'+fmt(amt)+'</span>'
    +'<span class="lsub num" style="width:38px;text-align:right">'+p+'%</span></div>'; }
  $("#insights-body").addEventListener("click",function(e){
    var d=e.target.closest("[data-delp]"); if(!d)return; var id=d.getAttribute("data-delp");
    var i=purchases.findIndex(function(p){return p.id===id;}); if(i<0)return;
    var rm=purchases.splice(i,1)[0]; savePurchases(); renderMonthStrip(); renderInsights();
    toast("Deleted","Undo",function(){ purchases.push(rm); savePurchases(); renderMonthStrip(); renderInsights(); });
  });

  /* ---------- nav ---------- */
  $$(".nav button").forEach(function(btn){ btn.addEventListener("click",function(){ showScreen(btn.getAttribute("data-go")); }); });
  function showScreen(name){
    $$(".screen").forEach(function(s){ s.classList.toggle("active", s.id==="screen-"+name); });
    $$(".nav button").forEach(function(b){ var on=b.getAttribute("data-go")===name; b.classList.toggle("active",on); b.classList.toggle("log",b.getAttribute("data-go")==="log"); });
    if(name==="subs")renderSubs(); if(name==="insights")renderInsights(); if(name==="log"){renderMonthStrip();}
    window.scrollTo(0,0);
  }

  /* ---------- toast ---------- */
  var toastEl=$("#toast"),toastMsg=$("#toast-msg"),toastAct=$("#toast-action"),toastTimer;
  function toast(msg,label,fn){ toastMsg.textContent=msg;
    if(label){ toastAct.style.display=""; toastAct.textContent=label; toastAct.onclick=function(){ hideToast(); fn&&fn(); }; }
    else { toastAct.style.display="none"; toastAct.onclick=null; }
    toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,label?4000:1600); }
  function hideToast(){ toastEl.classList.remove("show"); }

  /* ---------- sheets ---------- */
  var sheetBack=$("#sheet-back");
  function openSheet(el){ $$(".sheet").forEach(function(s){ s.classList.toggle("show", s===el); }); sheetBack.classList.add("show"); }
  function closeSheets(){ $$(".sheet").forEach(function(s){ s.classList.remove("show"); }); sheetBack.classList.remove("show"); }
  sheetBack.addEventListener("click", closeSheets);
  ["#open-settings","#open-settings-2","#open-settings-3"].forEach(function(s){ $(s).addEventListener("click",function(){ openSheet($("#sheet-settings")); }); });

  var curSel=$("#currency-sel"); curSel.value=settings.currency;
  if(curSel.value!==settings.currency){ var o=document.createElement("option"); o.value=settings.currency; o.textContent=settings.currency; curSel.appendChild(o); curSel.value=settings.currency; }
  curSel.addEventListener("change",function(){ settings.currency=curSel.value; saveSettings(); renderAmount(); renderMonthStrip(); renderSubs(); renderInsights(); });

  $("#export-btn").addEventListener("click",function(){
    var data=JSON.stringify({ app:"necessary-spending-tracker", version:2, exportedAt:new Date().toISOString(), settings:settings, purchases:purchases, subscriptions:subs },null,2);
    var url=URL.createObjectURL(new Blob([data],{type:"application/json"})); var a=document.createElement("a");
    a.href=url; a.download="spending-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000); closeSheets(); toast("Backup downloaded ✓");
  });
  $("#import-btn").addEventListener("click",function(){ $("#import-file").click(); });
  $("#import-file").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f)return; var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result);
      var ps=Array.isArray(d)?d:(d.purchases||d.entries||[]); var ss=(d.subscriptions||[]);
      var have={}; purchases.forEach(function(t){have[t.id]=1;}); var added=0;
      ps.forEach(function(t){ if(t&&typeof t.amount==="number"&&t.ts){ var bucket=(t.bucket==="need")?"need":"not"; if(!t.id)t.id=rid();
        if(!have[t.id]){ purchases.push({id:t.id,amount:t.amount,bucket:bucket,note:t.note||"",ts:t.ts}); added++; } } });
      var haveS={}; subs.forEach(function(s){haveS[s.id]=1;});
      ss.forEach(function(s){ if(s&&typeof s.amount==="number"&&s.name){ if(!s.id)s.id=rid(); if(!haveS[s.id]) subs.push({id:s.id,name:s.name,amount:s.amount,bucket:(s.bucket==="need"?"need":"not"),active:s.active!==false,ts:s.ts||Date.now()}); } });
      if(d.settings&&d.settings.currency){ settings.currency=d.settings.currency; saveSettings(); curSel.value=settings.currency; }
      savePurchases(); saveSubs(); renderAmount(); renderMonthStrip(); renderSubs(); renderInsights(); closeSheets(); toast(added+" purchase"+(added===1?"":"s")+" imported ✓");
    }catch(err){ closeSheets(); toast("Couldn't read that file"); } };
    r.readAsText(f); e.target.value="";
  });
  $("#wipe-btn").addEventListener("click",function(){
    if(!purchases.length&&!subs.length){ closeSheets(); toast("Nothing to delete"); return; }
    if(!confirm("Delete ALL purchases and subscriptions? This can't be undone. (Tip: export a backup first.)")) return;
    purchases=[]; subs=[]; savePurchases(); saveSubs(); renderMonthStrip(); renderSubs(); renderInsights(); closeSheets(); toast("All data deleted");
  });

  /* ---------- init ---------- */
  renderAmount(); renderMonthStrip(); renderInsights();
  if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
</body>
</html>
